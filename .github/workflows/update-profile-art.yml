name: Update profile art

# Refreshes the contribution graph + stats card SVGs daily from real data.
# Runs daily, on push to main, and on-demand via workflow_dispatch.

"on":
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  refresh-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, tiles, activity, repos, blue heatmap)
        run: python scripts/render_readme_cards.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(art): refresh profile readme cards and contribution stats [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
